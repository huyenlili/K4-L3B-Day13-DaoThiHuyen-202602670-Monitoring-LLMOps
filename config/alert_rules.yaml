alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-202602670
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'count(request_failed) / count(request_received) * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-202602670
    runbook: docs/alerts.md#alert-2
  - name: DailyCostOverBudget
    severity: warning
    condition: 'sum(response_sent.cost_usd) over 24h > 2.5'
    duration: 15m
    type: symptom-based
    channel: slack
    slack_channel: '#k4-l3b-alerts'
    owner: student-202602670
    runbook: docs/alerts.md#alert-3
